name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI (trusted publishing)
    needs: build
    # Tag pushes only create a GitHub release.  Set the repository variable
    # PUBLISH_PYPI=true (Settings > Secrets and variables > Actions > Variables)
    # to publish to PyPI as well.
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/macpm/
    permissions:
      id-token: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-running a release (or a manual workflow_dispatch to verify the
          # trusted publisher) must not fail on files that are already there.
          skip-existing: true

  github-release:
    name: GitHub release
    needs: [build]
    # Only a tag push creates/updates the release; a manual run is for PyPI.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep the release body in sync with the matching CHANGELOG section.
      - name: Extract release notes
        id: release_notes
        run: |
          python3 - <<'PY'
          import os
          import re

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag[1:] if tag.startswith("v") else tag
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^## {re.escape(version)}[^\n]*\n(.*?)(?=^## |\Z)",
              text,
              re.M | re.S,
          )
          if not match:
              raise SystemExit(f"no CHANGELOG section for {version}")

          body = match.group(1).strip()
          body += (
              "\n\n## Install\n\n"
              f"```sh\npython3 -m pip install --upgrade macpm=={version}\n```\n\n"
              "or with Homebrew:\n\n"
              "```sh\nbrew install visualcjy/macpm/macpm\n```\n\n"
              f"The standalone arm64 tarball (`macpm-{version}-macos-arm64.tar.gz`) "
              "is attached below.\n"
          )
          with open("release-notes.md", "w", encoding="utf-8") as handle:
              handle.write(body)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"version={version}\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: macpm ${{ steps.release_notes.outputs.version }}
          body_path: release-notes.md
          files: dist/*
